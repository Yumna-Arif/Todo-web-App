<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="tdx-hero">
    <div class="tdx-overlay">
        <h1 class="tdx-title">Todo App</h1>
    </div>
</header>

<main class="container my-5 tdx-page">

    <!-- Filters -->
    <div class="tdx-filter-wrap text-center mb-5">
        <div class="btn-group tdx-filter-group" role="group">
            <button class="btn tdx-filter-btn tdx-active" id="todayBtn">Today</button>
            <button class="btn tdx-filter-btn" id="pendingBtn">Pending</button>
            <button class="btn tdx-filter-btn" id="overdueBtn">Overdue</button>
        </div>
    </div>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3">
        <h2 class="tdx-section-title mb-0">Tasks</h2>
        <button class="btn tdx-add-btn" id="addTaskBtn">
            <i class="bi bi-plus-circle me-2"></i>Add Task
        </button>
    </div>

    <!-- Task List -->
    <div id="taskList"></div>

    <!-- Completed -->
    <div class="tdx-completed mt-4">
        <h3 class="tdx-completed-heading" id="toggleCompleted">
            Completed <span id="completedArrow">▲</span>
        </h3>
        <div id="completedList" class="mt-3"></div>
    </div>

</main>

<!-- Modal -->
<div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content tdx-modal">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add Task</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="taskForm">

                    <div class="mb-3">
                        <label class="form-label">Task Name</label>
                        <input type="text" class="form-control" id="taskName" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Due Date</label>
                        <input type="date" class="form-control" id="taskDate" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Priority</label>
                        <select class="form-select" id="taskPriority">
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>

                    <button type="submit" class="btn tdx-save w-100">Save Task</button>

                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
